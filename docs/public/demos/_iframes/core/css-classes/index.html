<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <style>body {
  background: #0d1117;
  color: #e6edf3;
  padding: 32px;
  font-family: system-ui, -apple-system, sans-serif;
}

.wrap { display: flex; justify-content: center; }

#list {
  width: 340px;
  padding: 16px;
  background: #111826;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,.1);
}

.item {
  background: #161b28;
  border: 1px solid rgba(255,255,255,.12);
  padding: 12px 14px;
  margin-bottom: 8px;
  border-radius: 6px;
  user-select: none;
}

/* -------------------------
   Custom drag class contract
-------------------------- */

.drag-active:not(.drag-ghost) {
  border: 2px dashed #ffd166;
  background: rgba(255,209,102,.12);
}

.drag-ghost {
  cursor: grabbing;
  transform: scale(1.02);
  opacity: 1;
  box-shadow:
      0 14px 40px rgba(0,0,0,.45),
      0 0 0 2px rgba(255,209,102,.6);
}

.drag-target {
  outline: 2px dashed rgba(255,255,255,.3);
}</style>
</head>
<body>
<div class="wrap">
  <div id="list">
    <div class="item" data-mosaic-id="1">One</div>
    <div class="item" data-mosaic-id="2">Two</div>
    <div class="item" data-mosaic-id="3">Three</div>
  </div>
</div>


<script type="module" src="/demos/_shared/mosaic.js"></script>
<script type="module">
  import { Mosaic } from '/demos/_shared/mosaic.js';

const mosaic = new Mosaic({
  root: document.getElementById('list'),

  selectors: {
    node: '.item'
  },

  cssClasses: {
    active: 'drag-active',
    ghost: 'drag-ghost',
    dropTarget: 'drag-target'
  }
});

mosaic.initialize();

</script>
</body>
</html>
