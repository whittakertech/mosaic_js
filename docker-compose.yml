services:
  mosaic:
    image: whittakertech/mosaicjs
    build: .
    container_name: whittakertech_mosaicjs
    volumes:
      - .:/app
    stdin_open: true
    tty: true
  mosaic-docs:
    image: whittakertech/mosaicjs
    build: .
    working_dir: /app
    command: >
      sh -c "npm run docs:generate &&
             npx vitepress dev docs --host 0.0.0.0 --port 5173 --no-open"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
    stdin_open: true
    tty: true

