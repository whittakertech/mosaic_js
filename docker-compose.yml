services:
  mosaic:
    image: whittakertech/mosaicjs
    build: .
    container_name: whittakertech_mosaicjs
    volumes:
      - .:/app
    stdin_open: true
    tty: true
  mosaic-docs:
    image: whittakertech/mosaicjs
    build: .
    working_dir: /app
    command: >
      sh -c "npm run docs:prepare &&
             npm run docs:dev"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
    stdin_open: true
    tty: true

