name: Docs

on:
  push:
    branches: [main, master]

permissions:
  contents: write

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  # Gitea-only internal preview (VitePress -> Gitea's own gh-pages).
  # Documentation publishing of record moved to Codex (the `codex_publish`
  # job below), which owns mosaicjs.whittakertech.com via GitHub Pages.
  # Kept as a Gitea-side dev preview so `docs:dev`-adjacent output stays
  # inspectable without waiting on a cross-repo Codex build.
  deploy-gitea-preview:
    if: github.server_url != 'https://github.com'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - run: npm run docs

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/.vitepress/dist
          publish_branch: gh-pages
          force_orphan: true

  # Real publish target: Codex compiles this repo's hand-written docs/
  # (minus the api/ subfolder, freshly regenerated below and overlaid by
  # Codex itself) plus the TypeDoc artifact into its shared Astro/Starlight
  # site, then deploys straight to this repo's own gh-pages on GitHub --
  # mosaicjs.whittakertech.com's real source from here on. Only fires on
  # real GitHub Actions (Gitea has no cross-instance reusable-workflow
  # resolution -- see ci.yml's identical guard for the same reason) and
  # only for the actual master build, not every PR/branch.
  build-docs-artifact:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci
      - run: npm run docs:api

      - uses: actions/upload-artifact@v4
        with:
          name: docs
          path: docs/api

  codex_publish:
    needs: build-docs-artifact
    if: github.server_url == 'https://github.com'
    uses: whittakertech/codex/.github/workflows/publish_docs.yml@main
    with:
      engine_owner: whittakertech
      engine_repo: mosaic_js
      engine_ref: ${{ github.sha }}
      docs_artifact_name: docs
      site_url: https://mosaicjs.whittakertech.com
    secrets:
      CODEX_GITHUB_TOKEN: ${{ secrets.CODEX_GITHUB_TOKEN }}
